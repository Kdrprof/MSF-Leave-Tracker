name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release (free public download link)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (leave rules & balance math)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Restore signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing key found."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is missing. APK is signed with a temporary debug key; future updates will not install over it. Add the secrets (see README)."
          fi

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ env.VERSION_NAME }}
          -PreleaseUrl=https://github.com/${{ github.repository }}/releases/latest/download/Leave-Tracker.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Leave-Tracker.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Leave-Tracker-${{ env.VERSION_NAME }}
          path: Leave-Tracker.apk

      - name: Publish GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Leave Tracker ${{ env.VERSION_NAME }}
          body: |
            حمّل ملف Leave-Tracker.apk من الأسفل وثبّته على هاتف أندرويد 8 أو أحدث.
            رابط دائم لآخر إصدار: https://github.com/${{ github.repository }}/releases/latest/download/Leave-Tracker.apk
          files: Leave-Tracker.apk
          make_latest: true
