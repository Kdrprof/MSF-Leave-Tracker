name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clean Workspace
      run: rm -rf * .gradle

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/msf/jordan/leavetracker
        
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "MSF-Leave-Tracker"
        include ':app'
        EOF
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.3.0'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
            }
        }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.msf.jordan.leavetracker'
            compileSdk 34
            defaultConfig {
                applicationId "com.msf.jordan.leavetracker"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion "1.5.14" }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.msf.jordan.leavetracker">
            <application android:allowBackup="true" android:label="MSF Tracker">
                <activity android:name=".AppLauncher" android:exported="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        AndroidManifest.xml
        EOF
        
        cat << 'EOF' > app/src/main/java/com/msf/jordan/leavetracker/AppLauncher.kt
        package com.msf.jordan.leavetracker

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.compose.ui.text.font.FontWeight

        data class PayslipSummary(val remainingBalance: Double)

        @Composable
        fun MainDashboardScreen(summary: PayslipSummary) {
            Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                Card(
                    modifier = Modifier.fillMaxWidth().padding(bottom = 24.dp),
                    colors = CardDefaults.cardColors(containerColor = Color(0xFF1E3A8A))
                ) {
                    Column(modifier = Modifier.padding(24.dp)) {
                        Text(text = "الرصيد المتبقي (Remaining)", color = Color.White, fontSize = 18.sp)
                        Text(text = "${summary.remainingBalance} يوم", color = Color(0xFF10B981), fontSize = 38.sp, fontWeight = FontWeight.Bold)
                    }
                }
            }
        }

        class AppLauncher : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent { MainDashboardScreen(summary = PayslipSummary(15.5)) }
            }
        }
        EOF

    - name: Download and Force Gradle 8.7
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        export PATH=$PWD/gradle-8.7/bin:$PATH
        gradle assembleDebug --no-daemon --no-build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MSF_Leave_Tracker_APK
        path: app/build/outputs/apk/debug/*.apk
