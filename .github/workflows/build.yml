name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Auto-Generate Android Architecture
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MSF-Leave-Tracker"
        include ':app'
        EOF
        
        mkdir -p app/src/main/java/com/msf/jordan/leavetracker
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.msf.jordan.leavetracker">
            <application android:allowBackup="true" android:label="MSF Tracker" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity android:name=".AppLauncher" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.0'
            id 'org.jetbrains.kotlin.android' version '1.9.0'
        }
        android {
            namespace 'com.msf.jordan.leavetracker'
            compileSdk 34
            defaultConfig {
                applicationId "com.msf.jordan.leavetracker"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion "1.5.1" }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.08.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
        }
        EOF
        
        cat << 'EOF' > app/src/main/java/com/msf/jordan/leavetracker/AppLauncher.kt
        package com.msf.jordan.leavetracker
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        class AppLauncher : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    val initialSummary = PayslipSummary(
                        previousBalance = 0.0,
                        accountedThisMonth = 0.0,
                        acquiredThisMonth = 2.08,
                        remainingBalance = 2.08
                    )
                    MainDashboardScreen(summary = initialSummary)
                }
            }
        }
        EOF
        
        mv app/src/main/java/MainActivity.kt app/src/main/java/com/msf/jordan/leavetracker/ 2>/dev/null || true

    - name: Build APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MSF_Leave_Tracker_APK
        path: app/build/outputs/apk/debug/*.apk
