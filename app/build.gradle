plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Values injected by GitHub Actions (see .github/workflows/build.yml). Local builds use the defaults.
def ciVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def ciVersionName = (project.findProperty('versionName') ?: '1.0.0').toString()
def releaseUrl = (project.findProperty('releaseUrl') ?: '').toString()

android {
    namespace 'com.msf.jordan.leavetracker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.msf.jordan.leavetracker'
        minSdk 26
        targetSdk 34
        versionCode ciVersionCode
        versionName ciVersionName
        buildConfigField 'String', 'RELEASE_URL', "\"${releaseUrl}\""
    }

    // Signing key comes from GitHub Secrets (never stored in the repo).
    // Same key on every build = updates install over the old version without losing data.
    def ksFile = file(System.getenv('SIGNING_KEYSTORE_PATH') ?: 'none')
    def hasKey = ksFile.exists() && System.getenv('SIGNING_KEYSTORE_PASSWORD')
    signingConfigs {
        if (hasKey) {
            shared {
                storeFile ksFile
                storePassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'leavetracker'
                keyPassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Without the secret, fall back to the debug key so the build still succeeds.
            signingConfig hasKey ? signingConfigs.shared : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    testImplementation 'junit:junit:4.13.2'
}
